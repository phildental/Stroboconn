<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111" />
  <title>Guitar Tuner</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;background:#111;color:#eee}
    main{width:min(92vw,440px);text-align:center;padding:24px 0}
    h1{font-size:1.2rem;font-weight:600;margin:0 0 1.5rem}
    #note{font-size:5.5rem;font-weight:800;line-height:1}
    #hz{opacity:.68;margin:.5rem 0 1.25rem;min-height:1.5em}
    .meter{position:relative;height:14px;background:#333;border-radius:99px;overflow:hidden;margin:.75rem 0}
    .meter:after{content:"";position:absolute;left:50%;top:0;width:2px;height:100%;background:#fff;transform:translateX(-1px)}
    #needle{position:absolute;left:50%;top:0;width:8px;height:100%;background:#ddd;border-radius:99px;transform:translateX(-50%);transition:left .08s linear}
    #cents{font-variant-numeric:tabular-nums;min-height:1.5em}
    .controls{display:grid;gap:.85rem;margin-top:1.4rem;text-align:left}
    label{font-size:.9rem;opacity:.75}
    select,button{width:100%;padding:.8rem .9rem;border-radius:10px;font:inherit}
    select{border:1px solid #444;background:#1b1b1b;color:#eee}
    .seg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
    .seg button,.strings button{border:1px solid #444;background:#1b1b1b;color:#eee;cursor:pointer}
    .seg button.active,.strings button.active{border-color:#eee;background:#eee;color:#111}
    .strings{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
    #tuningNotes{margin-top:.65rem;opacity:.65;font-size:.9rem;text-align:center}
    #start{margin-top:1rem;border:0;border-radius:999px;background:#eee;color:#111;font-weight:700;cursor:pointer}
    #status{margin-top:.75rem;opacity:.55;font-size:.85rem;min-height:1.3em}
    .good #note{color:#7ee787}
    .good #needle{background:#7ee787}
    small{display:block;margin-top:1rem;opacity:.5}
  </style>
</head>
<body>
<main id="app">
  <h1>Guitar Tuner</h1>
  <div id="note">—</div>
  <div id="hz">Tap start and play a string</div>
  <div class="meter" aria-label="Tuning meter"><div id="needle"></div></div>
  <div id="cents">♭ flat · in tune · sharp ♯</div>

  <div class="controls">
    <div>
      <label for="tuning">Tuning</label>
      <select id="tuning">
        <option value="standard">Standard — E A D G B E</option>
        <option value="dropD">Drop D — D A D G B E</option>
        <option value="eb">E♭ Standard — E♭ A♭ D♭ G♭ B♭ E♭</option>
        <option value="dStandard">D Standard — D G C F A D</option>
        <option value="dropCSharp">Drop C♯ — C♯ G♯ C♯ F♯ A♯ D♯</option>
        <option value="dropC">Drop C — C G C F A D</option>
        <option value="dropB">Drop B — B F♯ B E G♯ C♯</option>
        <option value="openG">Open G — D G D G B D</option>
        <option value="dadgad">DADGAD — D A D G A D</option>
      </select>
      <div id="tuningNotes">E2 · A2 · D3 · G3 · B3 · E4</div>
    </div>

    <div>
      <label>Mode</label>
      <div class="seg">
        <button id="autoMode" class="active" type="button">Auto</button>
        <button id="manualMode" type="button">Manual</button>
      </div>
    </div>

    <div id="manualWrap" hidden>
      <label>Manual string</label>
      <div id="stringButtons" class="strings"></div>
    </div>
  </div>

  <button id="start">Start tuner</button>
  <div id="status">Auto mode chooses the closest string in the selected tuning.</div>
  <small>For best results, pluck one string at a time and let it ring naturally.</small>
</main>

<script>
const app=document.querySelector("#app");
const noteEl=document.querySelector("#note");
const hzEl=document.querySelector("#hz");
const centsEl=document.querySelector("#cents");
const needle=document.querySelector("#needle");
const tuning=document.querySelector("#tuning");
const tuningNotes=document.querySelector("#tuningNotes");
const start=document.querySelector("#start");
const autoModeBtn=document.querySelector("#autoMode");
const manualModeBtn=document.querySelector("#manualMode");
const manualWrap=document.querySelector("#manualWrap");
const stringButtons=document.querySelector("#stringButtons");
const statusEl=document.querySelector("#status");

const tunings={
  standard:["E2","A2","D3","G3","B3","E4"],
  dropD:["D2","A2","D3","G3","B3","E4"],
  eb:["D♯2","G♯2","C♯3","F♯3","A♯3","D♯4"],
  dStandard:["D2","G2","C3","F3","A3","D4"],
  dropCSharp:["C♯2","G♯2","C♯3","F♯3","A♯3","D♯4"],
  dropC:["C2","G2","C3","F3","A3","D4"],
  dropB:["B1","F♯2","B2","E3","G♯3","C♯4"],
  openG:["D2","G2","D3","G3","B3","D4"],
  dadgad:["D2","A2","D3","G3","A3","D4"]
};

let mode="auto",manualIndex=0;
let audio,analyser,data,running=false;
let tracked=null,recent=[],smoothFreq=0,smoothCents=0,lastStableAt=0,lastUiAt=0;

const DETECT_RMS=.0012;
const ACQUIRE_RMS=.0032;
const TRACK_RMS=.0012;
const HOLD_MS=1400;
const UPDATE_MS=60;

function noteToMidi(note){
  const m=note.match(/^([A-G])([♯#]?)(-?\d+)$/);
  if(!m)return 69;
  const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];
  return (Number(m[3])+1)*12+base+(m[2]?1:0);
}
function noteToFreq(note){return 440*Math.pow(2,(noteToMidi(note)-69)/12)}
function getTargets(){return tunings[tuning.value].map((note,index)=>({note,index,freq:noteToFreq(note)}))}

function setMode(next){
  mode=next;
  autoModeBtn.classList.toggle("active",mode==="auto");
  manualModeBtn.classList.toggle("active",mode==="manual");
  manualWrap.hidden=mode!=="manual";
  statusEl.textContent=mode==="auto"
    ?"Auto mode chooses the closest string in the selected tuning."
    :"Manual mode searches directly around the selected string for maximum stability.";
  resetTracking();
}

function buildStringButtons(){
  stringButtons.innerHTML="";
  getTargets().forEach((t,i)=>{
    const b=document.createElement("button");
    b.type="button";
    b.textContent=t.note;
    b.className=i===manualIndex?"active":"";
    b.addEventListener("click",()=>{manualIndex=i;buildStringButtons();resetTracking()});
    stringButtons.appendChild(b);
  });
}

function resetTracking(){
  tracked=null;recent=[];smoothFreq=0;smoothCents=0;lastStableAt=0;
  noteEl.textContent="—";
  hzEl.textContent=running?"Play a string":"Tap start and play a string";
  centsEl.textContent="♭ flat · in tune · sharp ♯";
  needle.style.left="50%";
  app.classList.remove("good");
}

tuning.addEventListener("change",()=>{
  tuningNotes.textContent=tunings[tuning.value].join(" · ");
  manualIndex=Math.min(manualIndex,tunings[tuning.value].length-1);
  buildStringButtons();
  resetTracking();
});
autoModeBtn.addEventListener("click",()=>setMode("auto"));
manualModeBtn.addEventListener("click",()=>setMode("manual"));
buildStringButtons();

start.addEventListener("click",async()=>{
  if(running)return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}
    });
    audio=new (window.AudioContext||window.webkitAudioContext)();
    analyser=audio.createAnalyser();
    analyser.fftSize=4096;
    analyser.smoothingTimeConstant=0;
    data=new Float32Array(analyser.fftSize);
    audio.createMediaStreamSource(stream).connect(analyser);
    running=true;
    start.textContent="Listening…";
    start.disabled=true;
    hzEl.textContent="Play a string";
    requestAnimationFrame(tick);
  }catch{
    hzEl.textContent="Microphone access is required.";
  }
});

function candidateMatches(rawFreq){
  const targets=mode==="manual"?[getTargets()[manualIndex]]:getTargets();
  let best=null;

  // Recover both harmonics and subharmonics from a broad detector result.
  for(const factor of [1,.5,1/3,.25,2,3]){
    const candidate=rawFreq*factor;
    for(const t of targets){
      const cents=1200*Math.log2(candidate/t.freq);
      const score=Math.abs(cents);
      const limit=mode==="manual"?180:230;
      if(score<=limit&&(!best||score<best.score)){
        best={note:t.note,index:t.index,targetFreq:t.freq,measuredFreq:candidate,cents,score};
      }
    }
  }
  return best;
}

function targetedPitch(buf,rate,targetFreq){
  let rms=0;
  for(const v of buf)rms+=v*v;
  rms=Math.sqrt(rms/buf.length);
  if(rms<DETECT_RMS)return -1;

  let mean=0;
  for(const v of buf)mean+=v;
  mean/=buf.length;

  const x=new Float32Array(buf.length);
  for(let i=0;i<buf.length;i++)x[i]=buf[i]-mean;

  // Search a narrow pitch window around the manually selected string.
  // This prevents E4/B3 from being lost to lower subharmonic peaks.
  const lowFreq=targetFreq*Math.pow(2,-220/1200);
  const highFreq=targetFreq*Math.pow(2,220/1200);
  const minLag=Math.max(2,Math.floor(rate/highFreq));
  const maxLag=Math.min(x.length-2,Math.ceil(rate/lowFreq));

  let bestLag=-1,best=-Infinity;

  for(let lag=minLag;lag<=maxLag;lag++){
    let sum=0,normA=0,normB=0;
    for(let i=0;i<x.length-lag;i++){
      const a=x[i],b=x[i+lag];
      sum+=a*b;normA+=a*a;normB+=b*b;
    }
    const corr=sum/(Math.sqrt(normA*normB)||1);
    if(corr>best){best=corr;bestLag=lag}
  }

  // High strings decay quickly, so allow a little less periodicity.
  const minCorr=targetFreq>=240?.30:.36;
  if(bestLag<0||best<minCorr)return -1;

  const corrAt=lag=>{
    if(lag<minLag||lag>maxLag)return best;
    let sum=0,normA=0,normB=0;
    for(let i=0;i<x.length-lag;i++){
      const a=x[i],b=x[i+lag];
      sum+=a*b;normA+=a*a;normB+=b*b;
    }
    return sum/(Math.sqrt(normA*normB)||1);
  };

  const y0=corrAt(bestLag-1),y1=corrAt(bestLag),y2=corrAt(bestLag+1);
  const a=(y0+y2-2*y1)/2,b=(y2-y0)/2;
  const refined=a?bestLag-b/(2*a):bestLag;
  const freq=rate/refined;

  // Sanity-check the result against the selected target.
  const cents=Math.abs(1200*Math.log2(freq/targetFreq));
  return cents<=240?freq:-1;
}

function tick(now){
  analyser.getFloatTimeDomainData(data);
  let rms=0;
  for(const v of data)rms+=v*v;
  rms=Math.sqrt(rms/data.length);

  let rawFreq=-1;
  let match=null;

  if(mode==="manual"){
    const target=getTargets()[manualIndex];
    rawFreq=targetedPitch(data,audio.sampleRate,target.freq);
    if(rawFreq>0){
      const cents=1200*Math.log2(rawFreq/target.freq);
      match={
        note:target.note,
        index:target.index,
        targetFreq:target.freq,
        measuredFreq:rawFreq,
        cents,
        score:Math.abs(cents)
      };
    }
  }else{
    rawFreq=autoCorrelate(data,audio.sampleRate);
    match=rawFreq>40&&rawFreq<1400?candidateMatches(rawFreq):null;
  }

  if(match){
    const sameTarget=tracked&&tracked.index===match.index;
    const highManual=mode==="manual"&&match.targetFreq>=240;
    const acquireThreshold=highManual?.0022:ACQUIRE_RMS;
    const trackThreshold=highManual?.0008:TRACK_RMS;
    const canAcquire=rms>=acquireThreshold;
    const canTrack=sameTarget&&rms>=trackThreshold;

    if(canAcquire||canTrack){
      if(!tracked||(canAcquire&&tracked.index!==match.index)){
        tracked={note:match.note,index:match.index,targetFreq:match.targetFreq};
        recent=[];
        smoothFreq=match.measuredFreq;
        smoothCents=match.cents;
      }

      if(tracked&&tracked.index===match.index){
        recent.push(match.measuredFreq);
        if(recent.length>9)recent.shift();

        const sorted=[...recent].sort((a,b)=>a-b);
        const median=sorted[Math.floor(sorted.length/2)];
        const jumpCents=smoothFreq?Math.abs(1200*Math.log2(median/smoothFreq)):0;
        const isHigh=tracked.targetFreq>=240;
        const allowedJump=isHigh?55:75;

        if(!smoothFreq||jumpCents<allowedJump){
          const quiet=rms<ACQUIRE_RMS;
          const alpha=quiet?(isHigh?.035:.05):(isHigh?.08:.11);
          smoothFreq=smoothFreq?smoothFreq*(1-alpha)+median*alpha:median;
          lastStableAt=now;
        }
      }
    }
  }

  const holding=tracked&&smoothFreq>0&&now-lastStableAt<HOLD_MS;

  if(holding&&now-lastUiAt>=UPDATE_MS){
    const rawCents=1200*Math.log2(smoothFreq/tracked.targetFreq);
    const quiet=rms<ACQUIRE_RMS;
    const isHigh=tracked.targetFreq>=240;
    const centsAlpha=quiet?(isHigh?.03:.045):(isHigh?.08:.11);
    smoothCents=smoothCents*(1-centsAlpha)+rawCents*centsAlpha;

    const cents=Math.round(smoothCents);
    noteEl.textContent=tracked.note;
    hzEl.textContent=`${smoothFreq.toFixed(1)} Hz · target ${tracked.targetFreq.toFixed(1)} Hz`;
    centsEl.textContent=Math.abs(cents)<=1?"In tune":`${Math.abs(cents)}¢ ${cents<0?"flat":"sharp"}`;
    needle.style.left=(50+Math.max(-45,Math.min(45,cents*.55)))+"%";
    app.classList.toggle("good",Math.abs(cents)<=5);
    lastUiAt=now;
  }

  if(!holding&&tracked&&now-lastStableAt>=HOLD_MS)resetTracking();
  requestAnimationFrame(tick);
}

function autoCorrelate(buf,rate){
  let rms=0;
  for(const v of buf)rms+=v*v;
  rms=Math.sqrt(rms/buf.length);
  if(rms<DETECT_RMS)return -1;

  let mean=0;
  for(const v of buf)mean+=v;
  mean/=buf.length;

  const x=new Float32Array(buf.length);
  for(let i=0;i<buf.length;i++)x[i]=buf[i]-mean;

  const minLag=Math.floor(rate/1400);
  const maxLag=Math.min(Math.floor(rate/55),x.length-2);
  let bestLag=-1,best=-Infinity;

  for(let lag=minLag;lag<=maxLag;lag++){
    let sum=0,normA=0,normB=0;
    for(let i=0;i<x.length-lag;i++){
      const a=x[i],b=x[i+lag];
      sum+=a*b;normA+=a*a;normB+=b*b;
    }
    const corr=sum/(Math.sqrt(normA*normB)||1);
    if(corr>best){best=corr;bestLag=lag}
  }

  if(bestLag<0||best<.45)return -1;

  const corrAt=lag=>{
    if(lag<minLag||lag>maxLag)return best;
    let sum=0,normA=0,normB=0;
    for(let i=0;i<x.length-lag;i++){
      const a=x[i],b=x[i+lag];
      sum+=a*b;normA+=a*a;normB+=b*b;
    }
    return sum/(Math.sqrt(normA*normB)||1);
  };

  const y0=corrAt(bestLag-1),y1=corrAt(bestLag),y2=corrAt(bestLag+1);
  const a=(y0+y2-2*y1)/2,b=(y2-y0)/2;
  const refined=a?bestLag-b/(2*a):bestLag;
  return rate/refined;
}
</script>
</body>
</html>
